<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandor Dashboard</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-900"><main class="mx-auto max-w-7xl p-6">
<header class="mb-5"><h1 class="text-3xl font-bold">Mandor Dashboard</h1><p class="text-sm text-slate-500">Embedded artifact snapshot. Regenerate after changes.</p></header>
<nav id="tabs" class="mb-5 flex flex-wrap gap-2"></nav><section id="app"></section></main>
<script type="application/json" id="pm-data">__PM_DATA__</script>
<script>
const DATA=JSON.parse(document.getElementById('pm-data').textContent), app=document.getElementById('app'), tabs=document.getElementById('tabs');
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const card=(title,body)=>`<article class="rounded-lg bg-white p-4 shadow"><h3 class="mb-2 font-semibold">${title}</h3>${body}</article>`;
function markdown(items){return items.length?items.map(x=>card(esc(x.path),`<pre class="whitespace-pre-wrap text-sm">${esc(x.content)}</pre>`)).join(''):card('No documents','<p class="text-slate-500">No artifacts found.</p>')}
function jsonBy(suffix){return DATA.json.filter(x=>x.path.endsWith(suffix)).map(x=>x.value)}
function discovery(){return `<div class="grid gap-4">${markdown(DATA.markdown.filter(x=>x.path.startsWith('client-discovery/')))}</div>`}
function requirements(){let docs=DATA.markdown.filter(x=>x.path.startsWith('requirements/'));return `<div class="grid gap-4">${markdown(docs)}${DATA.wireframes.map(w=>card(esc(w.path),`<iframe class="h-96 w-full rounded border" sandbox srcdoc=""></iframe>`)).join('')}</div>`}
 function phaseCard(p){let tasks=Array.isArray(p.tasks)?p.tasks:[], done=tasks.filter(t=>t.status==='completed').length;return `<div class="min-w-64 flex-1 rounded bg-slate-50 p-3"><h4 class="mb-2 font-semibold">${esc(p.title||('Phase '+(p.phase_number??'')))} <span class="text-xs">${esc(p.status||'')}</span></h4><p class="mb-2 text-xs text-slate-500">Tasks: ${done}/${tasks.length} (${tasks.length?Math.round(done*100/tasks.length):0}%)</p>${tasks.map(t=>{let progress=Array.isArray(t.progress)?t.progress:[], latest=progress[progress.length-1];return `<div class="mb-2 rounded bg-white p-2 text-sm shadow-sm"><b>${esc(t.id||'')}</b> ${esc(t.title||'')}<div class="text-xs text-slate-500">${esc(t.status||'todo')} | progress ${progress.length}${latest?` | ${esc(latest.message)}`:''}</div></div>`}).join('')||'<p class="text-sm text-slate-500">No tasks.</p>'}</div>`}
 function plans(){let phases=DATA.json.filter(x=>/\/phase_[0-9]+\.json$/.test(x.path)), groups={};phases.forEach(x=>{let bits=x.path.split('/');let name=bits.length>2?bits[bits.length-2]:'unassigned';(groups[name]??=[]).push(x.value)});let timeline=jsonBy('plans/milestone-timeline.json')[0], ms=timeline?.milestones||[], done=ms.filter(m=>m.status==='completed').length;let summary=`Milestones: ${done}/${ms.length} (${ms.length?Math.round(done*100/ms.length):0}%) | WBS: ${(timeline?.wbs||[]).length} | Risks: ${(timeline?.risk_register||[]).length} | Changes: ${(timeline?.change_request_log||[]).length}`;return `<div class="mb-4 rounded-lg bg-white p-4 shadow"><b>Timeline summary</b><p class="text-sm">${summary}</p></div>${Object.entries(groups).map(([name,ps])=>`<details class="mb-4 rounded-lg bg-white p-4 shadow" open><summary class="cursor-pointer text-lg font-semibold">${esc(name)} (${ps.length} phases)</summary><div class="mt-4 flex gap-4 overflow-x-auto">${ps.sort((a,b)=>(a.phase_number??0)-(b.phase_number??0)).map(phaseCard).join('')}</div></details>`).join('')||card('No plans','<p class="text-slate-500">No phase JSON files found.</p>')}
function fallback(){let json=DATA.json.filter(x=>!x.path.endsWith('plans/milestone-timeline.json')&&!/\/phase_[^/]+\.json$/.test(x.path));let cards=json.map(x=>card(esc(x.path),`<pre class="whitespace-pre-wrap text-sm">${esc(JSON.stringify(x.value,null,2))}</pre>`)).join('');return cards+(DATA.unknown.length?markdown(DATA.unknown):'')}
const views=[['Client Discovery',discovery],['Requirements',requirements],['Plans',plans]];function show(i){app.innerHTML=views[i][1]()+(i===1?fallback():'');document.querySelectorAll('iframe').forEach((frame,n)=>frame.setAttribute('srcdoc',DATA.wireframes[n].content));tabs.querySelectorAll('button').forEach((b,j)=>b.className=j===i?'rounded bg-blue-600 px-3 py-2 text-white':'rounded bg-white px-3 py-2 shadow');}
views.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v[0];b.onclick=()=>show(i);tabs.append(b)});show(0);
</script></body></html>
