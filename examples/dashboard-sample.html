<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mandor · Live Dashboard (sample)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://md-block.verou.me/md-block.js"></script>
  <style>
    .prose h1,.prose h2,.prose h3,.prose h4 { font-weight:600; margin:0.6em 0 0.3em }
    .prose h1 { font-size:1.5rem } .prose h2 { font-size:1.25rem } .prose h3 { font-size:1.1rem }
    .prose p { margin:0.4em 0; line-height:1.55 }
    .prose ul { list-style:disc; padding-left:1.4em; margin:0.4em 0 }
    .prose ol { list-style:decimal; padding-left:1.4em; margin:0.4em 0 }
    .prose code { background:#f1f5f9; padding:1px 4px; border-radius:3px; font-size:0.9em }
    .prose pre { background:#0f172a; color:#e2e8f0; padding:0.8em; border-radius:6px; overflow-x:auto; font-size:0.85em }
    .prose pre code { background:transparent; color:inherit; padding:0 }
    .prose blockquote { border-left:3px solid #cbd5e1; padding-left:0.8em; color:#475569; margin:0.5em 0 }
    .prose a { color:#2563eb; text-decoration:underline }
    .prose hr { border:0; border-top:1px solid #e2e8f0; margin:1em 0 }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block }
    .dot.ok { background:#16a34a } .dot.stale { background:#f59e0b } .dot.err { background:#dc2626 }
    .tab-active { background:#1e293b; color:#fff }
    .scrollbar-thin::-webkit-scrollbar { height:6px; width:6px }
    .scrollbar-thin::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:3px }
    md-block { display: block; transition: opacity 150ms ease-in-out }
    md-block:not([rendered]) { opacity: 0 }
    .prose table { width: 100%; border-collapse: collapse; margin: 0.5em 0 }
    .prose th, .prose td { border: 1px solid #e2e8f0; padding: 0.45em 0.65em; text-align: left }
    .prose th { background: #f8fafc; font-weight: 600 }
    .banner { background:#fef3c7; border:1px solid #fcd34d; color:#92400e }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div class="banner text-xs px-4 py-1.5 text-center">
    Sample dashboard · embedded data only · open this file directly in a browser to view.
    Live mode: run <code class="bg-amber-100 px-1 rounded">mandor dashboard</code>; pick from the dropdown (projects are read from <code class="bg-amber-100 px-1 rounded">config.json</code>; <code class="bg-amber-100 px-1 rounded">mandor init</code> in a project registers it).
  </div>
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="mx-auto max-w-7xl px-6 py-3 flex items-center justify-between gap-4 flex-wrap">
      <div class="flex items-center gap-3 min-w-0">
        <h1 class="text-xl font-bold tracking-tight">Mandor</h1>
        <span class="text-xs px-2 py-0.5 rounded bg-sky-100 text-sky-700 font-medium">sample</span>
        <div class="flex items-center gap-1 min-w-0">
          <label for="project-picker" class="text-xs text-slate-500 shrink-0">project</label>
          <select id="project-picker" class="text-sm bg-white border border-slate-300 rounded px-2 py-1 max-w-xs truncate focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
        </div>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <div class="flex items-center gap-1.5 text-slate-600">
          <span id="status-dot" class="dot ok"></span>
          <span id="status-text">sample data</span>
        </div>
        <div class="text-slate-500">
          updated <span id="updated-at" class="font-mono">—</span>
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-500">
          <label class="flex items-center gap-1 cursor-pointer select-none">
            <input id="autorefresh" type="checkbox" class="accent-emerald-600">
            auto refresh
          </label>
          <span class="font-mono">off</span>
        </div>
      </div>
    </div>
    <nav id="tabs" class="mx-auto max-w-7xl px-6 pb-2 flex gap-1 overflow-x-auto scrollbar-thin"></nav>
  </header>
  <main class="mx-auto max-w-7xl p-6">
    <section id="summary" class="mb-6 grid grid-cols-2 md:grid-cols-5 gap-3"></section>
    <section id="app"></section>
    <section id="warnings" class="mt-6"></section>
  </main>
  <script>
    const POLL_MS = 1000;
    const state = { data: null, view: 0, autorefresh: false, timer: null, failures: 0, sig: null, openDetails: new Set(), activeProject: null, projectList: null };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtPct = (n, d) => d ? Math.round(n * 100 / d) + '%' : '—';
    const feedbackId = () => 'fb-' + Math.random().toString(36).slice(2, 9);
    function copyBtn(text, label, tone = 'slate') {
      const id = feedbackId();
      const toneCls = tone === 'blue' ? 'bg-blue-50 hover:bg-blue-100 text-blue-700 border-blue-200'
        : tone === 'amber' ? 'bg-amber-50 hover:bg-amber-100 text-amber-700 border-amber-200'
        : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200';
      return `<span class="inline-flex items-center gap-1.5">
        <button type="button" data-copy="${esc(text)}" data-feedback="${id}"
          class="copy-btn px-2 py-1 text-xs font-medium rounded border transition active:scale-95 ${toneCls}">
          ${esc(label)}
        </button>
        <span id="${id}" class="text-xs text-emerald-600 opacity-0 transition-opacity duration-200 select-none">copied</span>
      </span>`;
    }

    function docCard(path) {
      return `<article class="rounded-lg bg-white shadow-sm border border-slate-200 overflow-hidden">
        <header class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <span class="font-mono text-xs text-slate-600">${esc(path)}</span>
        </header>
        <div class="prose p-4 max-w-none"><md-block untrusted data-md-path="${esc(path)}"></md-block></div>
      </article>`;
    }

    function rawCard(path, content) {
      return `<article class="rounded-lg bg-white shadow-sm border border-slate-200 overflow-hidden">
        <header class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <span class="font-mono text-xs text-slate-600">${esc(path)}</span>
        </header>
        <pre class="p-4 text-xs overflow-x-auto scrollbar-thin">${esc(content || '')}</pre>
      </article>`;
    }

    function discoveryView(data) {
      const docs = data.markdown.filter(x => x.path.startsWith('client-discovery/'));
      if (!docs.length) return empty('No client discovery documents yet.');
      return `<div class="grid gap-4">${docs.map(x => docCard(x.path)).join('')}</div>`;
    }

    function requirementsView(data) {
      const docs = data.markdown.filter(x => x.path.startsWith('requirements/'));
      const wireDocs = docs.length ? docs.map(x => docCard(x.path)).join('') : '';
      const wires = data.wireframes.map(w => `<article class="rounded-lg bg-white shadow-sm border border-slate-200 overflow-hidden">
        <header class="px-4 py-2 bg-slate-50 border-b border-slate-200"><span class="font-mono text-xs text-slate-600">${esc(w.path)}</span></header>
        <iframe class="w-full h-96 bg-white" sandbox srcdoc=""></iframe>
      </article>`).join('');
      if (!docs.length && !data.wireframes.length) return empty('No requirements documents or wireframes yet.');
      return `<div class="grid gap-4">${wireDocs}${wires}</div>`;
    }

    function phaseCard(phase, planName) {
      const tasks = Array.isArray(phase.tasks) ? phase.tasks : [];
      const done = tasks.filter(t => t.status === 'completed').length;
      const phaseId = phase.phase_number ?? '';
      const executePrompt = `Execute ${planName} plan, phase ${phaseId} using mandor skill. Check previous phase, report first if any blocker`;
      const auditPrompt = `Audit ${planName} plan, phase ${phaseId} using mandor skill. Response me briefly`;
      return `<div class="min-w-72 flex-1 rounded-lg bg-slate-50 border border-slate-200 p-3">
        <h4 class="font-semibold mb-1">${esc(phase.title || ('Phase ' + phaseId))}</h4>
        <div class="flex flex-wrap items-center gap-1.5 mb-2">
          ${copyBtn(executePrompt, 'Execute', 'blue')}
          ${copyBtn(auditPrompt, 'Audit', 'amber')}
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-500 mb-2">
          <span class="px-1.5 py-0.5 rounded bg-white border">${esc(phase.status || 'todo')}</span>
          <span>${esc(phase.milestone_id || '')}</span>
        </div>
        <div class="text-xs text-slate-600 mb-2">tasks ${done}/${tasks.length} · ${fmtPct(done, tasks.length)}</div>
        ${tasks.map(t => {
          const prog = Array.isArray(t.progress) ? t.progress : [];
          const last = prog[prog.length - 1];
          const taskKey = `task-${esc(planName)}-${esc(phaseId)}-${esc(t.id || '')}`;
          const statusCls = t.status === 'completed' ? 'bg-emerald-100 text-emerald-700'
            : t.status === 'in_progress' ? 'bg-sky-100 text-sky-700'
            : t.status === 'failed' ? 'bg-rose-100 text-rose-700'
            : 'bg-slate-100 text-slate-700';
          const progHtml = prog.length
              ? `<ul class="mt-2 space-y-1.5">${prog.map(p => `<li class="text-xs text-slate-600 flex gap-2">
                  <span class="font-mono text-slate-400 shrink-0">${esc(p.timestamp || '')}</span>
                  <span>${esc(p.message || '')}</span>
                </li>`).join('')}</ul>`
              : '<p class="text-xs text-slate-400 italic mt-2">no progress entries</p>';
          return `<details data-key="${taskKey}" class="mb-2 rounded bg-white border border-slate-200 text-sm overflow-hidden">
            <summary class="cursor-pointer p-2 flex items-center justify-between gap-2 hover:bg-slate-50">
              <span class="min-w-0 truncate"><b class="font-mono text-xs text-slate-500">${esc(t.id || '')}</b> ${esc(t.title || '')}</span>
              <span class="text-xs px-1.5 py-0.5 rounded shrink-0 ${statusCls}">${esc(t.status || 'todo')}</span>
            </summary>
            <div class="px-2 pb-2 border-t border-slate-100">
              <p class="text-xs text-slate-700 mt-2 whitespace-pre-wrap">${esc(t.detail || '(no detail)')}</p>
              <div class="text-xs text-slate-500 mt-2">progress ${prog.length}${last ? ' · last: ' + esc(last.message) : ''}</div>
              ${progHtml}
            </div>
          </details>`;
        }).join('') || '<p class="text-sm text-slate-400 italic">no tasks</p>'}
      </div>`;
    }

    function plansView(data) {
      const phases = data.json.filter(x => /\/phase_[0-9]+\.json$/.test(x.path));
      const groups = {};
      phases.forEach(x => {
        const bits = x.path.split('/');
        const name = bits.length > 2 ? bits[bits.length - 2] : 'unassigned';
        (groups[name] ??= []).push(x.value);
      });
      const timeline = data.json.find(x => x.path.endsWith('plans/milestone-timeline.json'));
      const ms = timeline?.value?.milestones || [];
      const done = ms.filter(m => m.status === 'completed').length;
      const summary = timeline
        ? `Milestones ${done}/${ms.length} (${fmtPct(done, ms.length)}) · WBS ${(timeline.value.wbs || []).length} · Risks ${(timeline.value.risk_register || []).length} · Changes ${(timeline.value.change_request_log || []).length}`
        : 'No milestone timeline yet. Run `mandor milestone init` to create one.';
      const groups_html = Object.entries(groups).map(([name, ps]) => {
        const planExecutePrompt = `Execute ${name} plan using mandor skill`;
        const planAuditPrompt = `Audit ${name} plan using mandor skill. Response me briefly`;
        return `<details data-key="plan-${esc(name)}" class="mb-4 rounded-lg bg-white shadow-sm border border-slate-200 overflow-hidden">
        <summary class="cursor-pointer px-4 py-3 font-semibold flex items-center justify-between gap-3">
          <span class="flex items-center gap-3 min-w-0">
            <span class="truncate">${esc(name)}</span>
            <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-medium">${ps.length} phase${ps.length === 1 ? '' : 's'}</span>
          </span>
          <span class="flex items-center gap-2 shrink-0">
            ${copyBtn(planExecutePrompt, 'Execute plan', 'blue')}
            ${copyBtn(planAuditPrompt, 'Audit plan', 'amber')}
          </span>
        </summary>
        <div class="p-4 flex gap-3 overflow-x-auto scrollbar-thin">${ps.sort((a,b) => (a.phase_number ?? 0) - (b.phase_number ?? 0)).map(p => phaseCard(p, name)).join('')}</div>
      </details>`;
      }).join('');
      return `<div class="mb-4 rounded-lg bg-white shadow-sm border border-slate-200 p-4">
        <div class="font-semibold mb-1">Timeline</div>
        <p class="text-sm text-slate-600">${esc(summary)}</p>
      </div>${groups_html || empty('No plans or phases yet.')}`;
    }

    function fallbackView(data) {
      const json = data.json.filter(x =>
        !x.path.endsWith('plans/milestone-timeline.json')
        && !/\/phase_[^/]+\.json$/.test(x.path));
      const cards = json.map(x => `<article class="rounded-lg bg-white shadow-sm border border-slate-200 overflow-hidden">
        <header class="px-4 py-2 bg-slate-50 border-b border-slate-200"><span class="font-mono text-xs text-slate-600">${esc(x.path)}</span></header>
        <pre class="p-4 text-xs overflow-x-auto scrollbar-thin">${esc(JSON.stringify(x.value, null, 2))}</pre>
      </article>`).join('');
      const unknownDocs = data.unknown.length
        ? `<div class="mt-4"><div class="text-sm font-semibold mb-2 text-slate-600">Unknown files</div><div class="grid gap-4">${data.unknown.map(x => rawCard(x.path, x.content)).join('')}</div></div>`
        : '';
      return (cards || '<p class="text-slate-400 italic">No additional JSON files.</p>') + unknownDocs;
    }

    function summaryCards(data) {
      const json = data.json.length;
      const md = data.markdown.length;
      const wf = data.wireframes.length;
      const phases = data.json.filter(x => /\/phase_[0-9]+\.json$/.test(x.path)).length;
      const warns = data.warnings.length;
      const items = [
        ['Markdown', md, 'bg-emerald-50 text-emerald-700'],
        ['JSON', json, 'bg-sky-50 text-sky-700'],
        ['Phases', phases, 'bg-indigo-50 text-indigo-700'],
        ['Wireframes', wf, 'bg-amber-50 text-amber-700'],
        ['Warnings', warns, warns ? 'bg-rose-50 text-rose-700' : 'bg-slate-50 text-slate-500']
      ];
      return items.map(([label, n, cls]) => `<div class="rounded-lg ${cls} px-4 py-3 border border-current/10">
        <div class="text-2xl font-bold">${n}</div>
        <div class="text-xs uppercase tracking-wide opacity-80">${label}</div>
      </div>`).join('');
    }

    function warningsView(data) {
      if (!data.warnings.length) return '';
      return `<details data-key="warnings" class="rounded-lg bg-amber-50 border border-amber-200 p-4">
        <summary class="cursor-pointer font-semibold text-amber-800">${data.warnings.length} warning${data.warnings.length === 1 ? '' : 's'}</summary>
        <ul class="mt-3 list-disc pl-5 text-sm text-amber-900 space-y-1">
          ${data.warnings.map(w => `<li><code class="text-xs">${esc(w)}</code></li>`).join('')}
        </ul>
      </details>`;
    }

    function empty(msg) { return `<div class="rounded-lg bg-white border border-dashed border-slate-300 p-8 text-center text-slate-500">${esc(msg)}</div>`; }

    const views = [
      { label: 'Discovery', render: discoveryView },
      { label: 'Requirements', render: requirementsView },
      { label: 'Plans', render: plansView },
      { label: 'Raw JSON', render: fallbackView }
    ];

    function buildTabs() {
      const tabs = $('tabs');
      tabs.innerHTML = '';
      views.forEach((v, i) => {
        const b = document.createElement('button');
        b.textContent = v.label;
        b.className = 'px-3 py-1.5 rounded text-sm font-medium transition ' + (i === state.view ? 'tab-active' : 'text-slate-600 hover:bg-slate-200');
        b.onclick = () => { state.view = i; renderCurrent(); buildTabs(); };
        tabs.appendChild(b);
      });
    }

    function restoreOpenState(root) {
      root.querySelectorAll('details[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (state.openDetails.has(key)) el.setAttribute('open', '');
        else el.removeAttribute('open');
      });
    }

    function renderCurrent() {
      const data = state.data;
      if (!data) return;
      $('summary').innerHTML = summaryCards(data);
      $('app').innerHTML = views[state.view].render(data);
      $('warnings').innerHTML = warningsView(data);
      restoreOpenState($('app'));
      restoreOpenState($('warnings'));
      $('app').querySelectorAll('md-block[data-md-path]').forEach(el => {
        const doc = data.markdown.find(m => m.path === el.getAttribute('data-md-path'));
        if (doc) el.mdContent = doc.content;
      });
      $('app').querySelectorAll('iframe').forEach((frame, n) => {
        frame.srcdoc = data.wireframes[n]?.content || '';
      });
    }

    function bindDetailsToggle() {
      const handler = (event) => {
        const el = event.target;
        if (!(el instanceof HTMLDetailsElement) || !el.hasAttribute('data-key')) return;
        const key = el.getAttribute('data-key');
        if (el.open) state.openDetails.add(key);
        else state.openDetails.delete(key);
      };
      ['app', 'warnings'].forEach(id => {
        const node = $(id);
        if (node) node.addEventListener('toggle', handler, true);
      });
    }

    async function poll() {
      // Sample mode: no remote fetch. If autorefresh is enabled, attempt /api/data.
      if (!state.autorefresh) return;
      try {
        const qs = state.activeProject ? `?project=${encodeURIComponent(state.activeProject)}` : '';
        const res = await fetch('/api/data' + qs, { cache: 'no-store' });
        if (!res.ok) throw new Error('status ' + res.status);
        const data = await res.json();
        state.data = data;
        state.failures = 0;
        $('status-dot').className = 'dot ok';
        $('status-text').textContent = 'live';
        $('updated-at').textContent = data.meta?.generated_at
          ? new Date(data.meta.generated_at).toLocaleTimeString()
          : '—';
        const sig = JSON.stringify([data.markdown, data.json, data.wireframes, data.unknown, data.warnings]);
        if (sig !== state.sig) { state.sig = sig; renderCurrent(); }
      } catch (error) {
        state.failures += 1;
        $('status-dot').className = 'dot ' + (state.failures > 2 ? 'err' : 'stale');
        $('status-text').textContent = state.failures > 2 ? `offline (${state.failures})` : 'reconnecting…';
      }
    }

    async function populateProjectPicker() {
      const sel = $('project-picker');
      // Sample mode: build a single-option picker from embedded data so the
      // dropdown is visible even without a server.
      try {
        const res = await fetch('/api/projects', { cache: 'no-store' });
        if (!res.ok) throw new Error('status ' + res.status);
        const payload = await res.json();
        sel.innerHTML = '';
        for (const p of payload.projects) {
          const opt = document.createElement('option');
          opt.value = p.path;
          opt.textContent = p.path === payload.default ? `${p.name} (default)` : p.name;
          opt.title = p.path;
          sel.appendChild(opt);
        }
        const url = new URL(location.href);
        const requested = url.searchParams.get('project');
        state.activeProject = requested || payload.default;
        sel.value = state.activeProject;
        sel.addEventListener('change', () => {
          const next = sel.value;
          const u = new URL(location.href);
          if (next === payload.default) u.searchParams.delete('project');
          else u.searchParams.set('project', next);
          history.replaceState({}, '', u);
          state.activeProject = next;
          state.sig = null;
          poll();
        });
      } catch (_) {
        // Fallback: show the embedded sample project as a static option.
        const projectPath = SAMPLE.meta?.project || 'examples/sample-project';
        sel.innerHTML = '';
        const opt = document.createElement('option');
        opt.value = projectPath;
        opt.textContent = projectPath.split(/[\\/]/).pop() + ' (sample)';
        opt.title = projectPath;
        sel.appendChild(opt);
        sel.disabled = true;
      }
    }

    // ---------- Embedded sample data ----------
    const BRIEF = `# Client Brief — Toko Online

## 1. Client
PT Maju Bersama, Indonesian SME marketplace operator, founded 2019.

## 2. Problem
Buyers distrust sellers because product photos are inconsistent and COD fraud is high.

## 3. Target users
- **Buyers**: Indonesian mobile-first shoppers, 22–45, prefer COD.
- **Sellers**: small brands with 10–500 SKUs.

## 4. Success metrics
- 30-day repeat purchase rate ≥ 25%
- COD fraud rate ≤ 5%
- Median time-to-purchase ≤ 4 minutes

## 5. Constraints
- IDR pricing, Bahasa Indonesia UI
- Must integrate with Xendit (payments) and JNE/J&T (shipping)
- MVP budget: USD 80k, 90 days

## 6. Out of scope (MVP)
- Loyalty program (deferred to v2)
- Live-stream shopping
- Cross-border shipping

## 7. Approval
Discovery gate approved 2026-09-05 by PM.
`;

    const BRD = `# Business Requirements — Toko Online

## B1. Catalog
- Sellers publish products with ≥3 photos (mandatory)
- Standardized taxonomy: category → subcategory → tags

## B2. Trust & safety
- Verified-seller badge tied to NPWP + business bank account
- Buyer protection: full refund if item not delivered in 14 days

## B3. Payments
- Methods: COD, virtual account (BCA/Mandiri/BNI), e-wallet (OVO/GoPay/DANA)
- Settlement T+3 to seller bank account

## B4. Logistics
- Carrier integration: JNE, J&T, SiCepat
- Real-time tracking, webhook on delivery

## B5. Operations
- Seller CSV bulk upload (≤ 10k SKUs per file)
- Admin dashboard for dispute resolution

## B6. Approvals
- Source: discovery/interviews/* + PRD §2
- Approved 2026-09-12
`;

    const PRD = `# Product Requirements — Toko Online

## P1. Onboarding
- Buyer signup: email+password or Google OAuth
- Seller signup: extra KYC step (NPWP, bank statement)

## P2. Catalog (MoSCoW)
- **Must**: product CRUD, search, filters, ≥3 photo upload
- **Should**: bulk CSV upload, variant management
- **Could**: AR preview, video clips
- **Won't (MVP)**: live-stream, AI recommendations

## P3. Cart & checkout
- Single-seller carts only (MVP); multi-seller = v2
- Address book with pin-point map selection

## P4. Post-purchase
- Order tracking timeline
- Dispute chat with seller + admin escalation

## P5. Notifications
- Channels: in-app, email, WhatsApp (via WA Business API)
- Triggers: order placed, paid, shipped, delivered, dispute opened
`;

    const STORY = `# US-001 · Buyer signup with email+password

**As** a new buyer
**I want** to sign up with my email and password
**So that** I can start shopping without sharing phone number

## Acceptance criteria
- Email format validated; password ≥ 8 chars, ≥ 1 digit
- Confirmation email sent within 30s
- Rate limit: 10 signups per minute per IP
- Duplicate email returns 409 with friendly message

## Notes
- See wireframe \`wf_1.html\` (signup screen)
- Depends on backend task task-001, task-002
`;

    const STORY2 = `# US-002 · Seller CSV bulk upload

**As** a seller with 200+ SKUs

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      return ok;
    }

    function handleCopyClick(event) {
      const btn = event.target.closest('.copy-btn');
      if (!btn) return;
      event.preventDefault();
      event.stopPropagation();
      const text = btn.getAttribute('data-copy') || '';
      const fbId = btn.getAttribute('data-feedback');
      copyText(text).then((ok) => {
        const fb = fbId && document.getElementById(fbId);
        if (!fb) return;
        fb.textContent = ok ? 'copied' : 'failed';
        fb.className = fb.className.replace(/text-emerald-600|text-rose-600/, '') + (ok ? ' text-emerald-600' : ' text-rose-600');
        fb.style.opacity = '1';
        clearTimeout(btn._fbTimer);
        btn._fbTimer = setTimeout(() => { fb.style.opacity = '0'; }, 1400);
      });
    }
    start();
